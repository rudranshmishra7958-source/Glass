<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download scan</title>
    <link rel="stylesheet" href="scan.css" />
  </head>
  <body>
    <header class="scan-top">
      <div>

    <script src="scan.js"></script>

</html>
