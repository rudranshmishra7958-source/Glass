<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="is-loading">
    <header class="header">
      <div class="brand-row">
        <img class="brand-logo" src="../icons/icon128.png" alt="" />
        <div>
          <p class="brand">Glass</p>
          <p class="status" id="status">Reading this page…</p>
        </div>
      </div>
      <div class="domain-row">
        <img id="favicon" class="favicon" alt="" hidden />
        <p class="domain" id="domain">…</p>
      </div>
    </header>

    <section class="pause-banner glass-panel" id="pause-banner" hidden>
      <p class="toggle-title">Protection is paused</p>
      <p class="toggle-hint" id="pause-hint">Blocking is off until you resume.</p>
      <button type="button" class="dashboard-link" id="resume-protection">Resume protection</button>
    </section>

    <section class="pause-controls glass-panel" id="pause-controls">
      <p class="toggle-title">Pause protection</p>
      <p class="toggle-hint">Temporarily skip all blocking, including phishing redirects.</p>
      <div class="pause-actions">
        <button type="button" class="pause-btn" data-pause="600000">10 min</button>
        <button type="button" class="pause-btn" data-pause="3600000">1 hour</button>
        <button type="button" class="pause-btn" data-pause="startup">Until restart</button>
      </div>
    </section>

    <section class="badge glass-panel skeleton-target" id="badge" data-severity="green">
      <p class="badge-count" id="badge-count">—</p>
      <p class="badge-label" id="badge-label">trackers</p>
      <p class="badge-split" id="badge-split" hidden></p>
    </section>

    <section class="categories skeleton-target" id="categories"></section>

    <section class="list-wrap glass-panel skeleton-target">
      <h2 class="list-title">Trackers on this page</h2>
      <div class="tracker-list" id="tracker-list">
        <p class="empty">Reading this page…</p>
      </div>
    </section>

    <label class="toggle glass-panel">
      <span class="toggle-copy">
        <span class="toggle-title">Block trackers on this site</span>
        <span class="toggle-hint">Reload the page after switching</span>
      </span>
      <input type="checkbox" id="block-toggle" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section class="category-toggles" id="category-toggles" hidden></section>

    <section class="security-wrap glass-panel skeleton-target" id="security-wrap" hidden>
      <h2 class="list-title">Security warnings</h2>
      <div id="security-warnings"></div>
    </section>

    <label class="toggle trust-toggle glass-panel">
      <span class="toggle-copy">
        <span class="toggle-title">Trust this site</span>
        <span class="toggle-hint">Skip tracker blocking here</span>
      </span>
      <input type="checkbox" id="trust-toggle" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <footer class="footer">
      <p id="lifetime" class="lifetime" hidden></p>
      <button type="button" class="dashboard-link" id="open-dashboard">Open full dashboard</button>
      <p>Everything above stays on your device.</p>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
