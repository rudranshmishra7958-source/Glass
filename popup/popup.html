<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="is-loading">
    <header class="header">
      <div>
        <p class="brand">Glass</p>
        <p class="status" id="status">Reading this page…</p>
      </div>
      <div class="domain-row">
        <img id="favicon" class="favicon" alt="" hidden />
        <p class="domain" id="domain">…</p>
      </div>
    </header>

    <section class="badge skeleton-target" id="badge" data-severity="green">
      <p class="badge-count" id="badge-count">—</p>
      <p class="badge-label" id="badge-label">trackers</p>
      <p class="badge-split" id="badge-split" hidden></p>
    </section>

    <section class="categories skeleton-target" id="categories"></section>

    <section class="list-wrap skeleton-target">
      <h2 class="list-title">Trackers on this page</h2>
      <div class="tracker-list" id="tracker-list">
        <p class="empty">Reading this page…</p>
      </div>
    </section>

    <label class="toggle">
      <span class="toggle-copy">
        <span class="toggle-title">Block trackers on this site</span>
        <span class="toggle-hint">Reload the page after switching</span>
      </span>
      <input type="checkbox" id="block-toggle" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <section class="category-toggles" id="category-toggles" hidden></section>

    <footer class="footer">
      <p id="lifetime" class="lifetime" hidden></p>
      <p>Everything above stays on your device.</p>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
