<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Vault - Unified Full Dashboard</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-input: #1a2234;
      --border-color: #26334d;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 2rem; background: var(--bg-card); border-bottom: 1px solid var(--border-color);
    }
    .nav-brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.2rem; }
    .layout { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }
    .sidebar { width: 240px; border-right: 1px solid var(--border-color); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .sidebar-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.85rem; border-radius: var(--radius); background: transparent;
      border: none; color: var(--text-secondary); cursor: pointer; width: 100%; text-align: left; font-size: 13px;
    }
    .sidebar-btn:hover { background: var(--bg-card); color: var(--text-primary); }
    .sidebar-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .main-content { flex: 1; padding: 1.75rem 2rem; overflow-y: auto; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 0.5rem 1rem;
      border-radius: var(--radius); border: 1px solid transparent; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #042f2e; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-input); border-color: var(--border-color); color: var(--text-primary); }
    .btn-danger { background: var(--danger-light); color: var(--danger); }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-top: 1.25rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .card-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: var(--bg-input); padding: 0.35rem 0.65rem; border-radius: 6px; }
    .form-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 0.6rem 0.85rem; color: var(--text-primary); font-size: 13px; margin-top: 0.35rem; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); width: 100%; max-width: 480px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; border: 1px solid var(--primary); padding: 0.65rem 1.25rem; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="full-vault-app"></div>
  <script type="module" src="vault.js"></script>
</body>
</html>
